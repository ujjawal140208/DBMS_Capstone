services:
  - type: web
    name: caresphere-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix Backend && npm ci --prefix Frontend && npm run build --prefix Frontend
    startCommand: npm start --prefix Backend
    healthCheckPath: /api/health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_NAME
        value: caresphere_db
      - key: MONGODB_URI
        sync: false

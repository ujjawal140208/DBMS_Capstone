services:
  - type: web
    name: caresphere-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_NAME
        value: caresphere_db
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
